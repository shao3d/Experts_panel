<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scout</title>
  <meta name="description" content="A research agent I built inside my Experts Panel. It searches visual Telegram channels, AI video lessons in my VideoHub and lessons from my own projects, linking every answer back to its source.">
  <meta property="og:title" content="Scout · Research for visual production">
  <meta property="og:description" content="A research agent I built inside my Experts Panel. It searches visual Telegram channels, AI video lessons in my VideoHub and lessons from my own projects, linking every answer back to its source.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shao3d.github.io/scout-web/">
  <meta property="og:site_name" content="Scout">
  <meta name="twitter:card" content="summary">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Literata:opsz,wght@7..72,400;7..72,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/marked.js" defer></script>
  <script src="vendor/purify.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><h1>Scout</h1><p>Telegram visuals + VideoHub</p></header>
  <main>
    <form id="login" class="composer">
      <label class="sr-only" for="password">Scout password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Scout password" required>
      <button>Sign in</button>
    </form>
    <form id="ask" class="composer" hidden>
      <label class="sr-only" for="question">Question for Scout</label>
      <textarea id="question" rows="2" maxlength="6000" placeholder="Ask a question…" aria-describedby="shortcut" required></textarea>
      <button id="action">Send</button>
    </form>
    <div class="status"><span id="message" role="status" aria-live="polite"></span><span id="shortcut" hidden>Shift + Enter — send</span></div>
    <article id="answer" aria-label="Scout answer" hidden></article>
    <button id="copy" class="quiet" hidden>Copy</button>
  </main>
</body>
</html>
